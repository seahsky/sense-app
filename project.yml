name: Sense

options:
  bundleIdPrefix: com.senseapp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  SenseKit:
    path: Packages/SenseKit
  SenseUI:
    path: Packages/SenseUI

targets:
  SenseApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SenseApp
    settings:
      base:
        INFOPLIST_FILE: SenseApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SENSE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: SenseWatch
        embed: true
      - package: SenseKit
      - package: SenseUI

  SenseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SenseWatch
    settings:
      base:
        INFOPLIST_FILE: SenseWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios.watchkitapp
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SENSE Watch
        CODE_SIGN_ENTITLEMENTS: SenseWatch/SenseWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: SenseKit
      - package: SenseUI

  # Hosts the SenseKit package's unit tests inside the app project.
  #
  # The tests can also be run straight from the package
  # (`xcodebuild test -scheme SenseKit` in Packages/SenseKit), but that path
  # depends on xcodebuild inferring supported platforms for a bare Package.swift,
  # which fails intermittently with "Supported platforms for the buildables in the
  # current scheme is empty" and then offers no simulator destination at all.
  # Running them through the project uses the same destination resolution as every
  # other target, so one working simulator is enough for the whole repo.
  SenseKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/SenseKit/Tests/SenseKitTests
    dependencies:
      - package: SenseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios.kittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        ENABLE_TESTABILITY: YES

schemes:
  SenseKitTests:
    build:
      targets:
        SenseKitTests: [test]
    test:
      targets:
        - SenseKitTests
      gatherCoverageData: false
