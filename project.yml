name: Cindy

options:
  bundleIdPrefix: com.cindyapp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  CindyKit:
    path: Packages/CindyKit

targets:
  CindyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CindyApp
    settings:
      base:
        INFOPLIST_FILE: CindyApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cindyapp.ios
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Cindy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: CindyWatch
        embed: true
      - package: CindyKit

  CindyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CindyWatch
    settings:
      base:
        INFOPLIST_FILE: CindyWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cindyapp.ios.watchkitapp
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Cindy Watch
        CODE_SIGN_ENTITLEMENTS: CindyWatch/CindyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: CindyKit

  # Hosts the CindyKit package's unit tests inside the app project.
  #
  # The tests can also be run straight from the package
  # (`xcodebuild test -scheme CindyKit` in Packages/CindyKit), but that path
  # depends on xcodebuild inferring supported platforms for a bare Package.swift,
  # which fails intermittently with "Supported platforms for the buildables in the
  # current scheme is empty" and then offers no simulator destination at all.
  # Running them through the project uses the same destination resolution as every
  # other target, so one working simulator is enough for the whole repo.
  CindyKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/CindyKit/Tests/CindyKitTests
    dependencies:
      - package: CindyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cindyapp.ios.kittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        ENABLE_TESTABILITY: YES

schemes:
  CindyKitTests:
    build:
      targets:
        CindyKitTests: [test]
    test:
      targets:
        - CindyKitTests
      gatherCoverageData: false
