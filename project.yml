name: Sense

options:
  bundleIdPrefix: com.senseapp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  SenseKit:
    path: Packages/SenseKit
  SenseUI:
    path: Packages/SenseUI

targets:
  SenseApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Same pre-existing bug as SenseWatch below: entitlements-and-plist-notes.md
      # sits in this directory and was being copied into the built app as a bundle
      # resource, so the shipped phone app carried a developer note too.
      - path: SenseApp
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: SenseApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SENSE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: SenseWatch
        embed: true
      - package: SenseKit
      - package: SenseUI

  SenseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # The excludes fix a pre-existing bug rather than support the complication:
      # entitlements-and-plist-notes.md sits in this directory and XcodeGen was
      # copying it into the built watch app as a bundle resource, so the shipped
      # app carried a developer note about its own entitlements.
      - path: SenseWatch
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: SenseWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios.watchkitapp
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SENSE Watch
        CODE_SIGN_ENTITLEMENTS: SenseWatch/SenseWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.10"
    dependencies:
      # On SenseWatch, not SenseApp. This is what produces the
      # PBXCopyFilesBuildPhase with dstSubfolderSpec = 13, which is the watch
      # app's PlugIns directory; embedded in the phone app instead, the appex
      # would install where watchOS never looks for it.
      - target: SenseComplication
        embed: true
        codeSign: true
      - package: SenseKit
      - package: SenseUI

  # watchOS WidgetKit complication. `app-extension` maps to
  # com.apple.product-type.app-extension, which is what Xcode 26's own watchOS
  # Widget Extension template uses; `watchkit2-extension` is the legacy WatchKit
  # Extension product type and is NOT it.
  #
  # PRODUCT_BUNDLE_IDENTIFIER must be prefixed by the WATCH app's identifier, not
  # the phone's. com.senseapp.ios.complication fails the BUILD at
  # ValidateEmbeddedBinary — "Embedded binary's bundle identifier is not prefixed
  # with the parent app's bundle identifier" — and it fails even with
  # CODE_SIGNING_ALLOWED=NO, so CI catches a wrong prefix immediately.
  #
  # XcodeGen derives SDKROOT=watchos, TARGETED_DEVICE_FAMILY=4, SKIP_INSTALL=YES
  # and WATCHOS_DEPLOYMENT_TARGET from platform + deploymentTarget, so none of
  # those are stated here. No asset catalog and no ASSETCATALOG_COMPILER_*
  # settings either: a watch complication takes its tint from the face, and a
  # third AccentColor.colorset would put a raw 0x6E86F7 outside SenseColor.
  # No CODE_SIGN_ENTITLEMENTS: this extension reads no HealthKit and no Core
  # Motion, and SenseWatch.entitlements stays HealthKit-only and untouched.
  SenseComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SenseComplication
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: SenseComplication/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios.watchkitapp.complication
        DEVELOPMENT_TEAM: PGK46N254T
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: SENSE Complication
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: SenseKit
      - package: SenseUI

  # Hosts the SenseKit package's unit tests inside the app project.
  #
  # The tests can also be run straight from the package
  # (`xcodebuild test -scheme SenseKit` in Packages/SenseKit), but that path
  # depends on xcodebuild inferring supported platforms for a bare Package.swift,
  # which fails intermittently with "Supported platforms for the buildables in the
  # current scheme is empty" and then offers no simulator destination at all.
  # Running them through the project uses the same destination resolution as every
  # other target, so one working simulator is enough for the whole repo.
  SenseKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/SenseKit/Tests/SenseKitTests
    dependencies:
      - package: SenseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senseapp.ios.kittests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        ENABLE_TESTABILITY: YES

schemes:
  SenseKitTests:
    build:
      targets:
        SenseKitTests: [test]
    test:
      targets:
        - SenseKitTests
      gatherCoverageData: false
