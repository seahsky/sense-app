name: CindyApp

options:
  bundleIdPrefix: com.cindyapp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

packages:
  CindyKit:
    path: Packages/CindyKit

targets:
  CindyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CindyApp
    settings:
      base:
        INFOPLIST_FILE: CindyApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cindyapp.ios
        PRODUCT_NAME: Cindy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
    dependencies:
      - target: CindyWatch
        embed: true
      - package: CindyKit

  CindyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CindyWatch
    settings:
      base:
        INFOPLIST_FILE: CindyWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cindyapp.watchkitapp
        PRODUCT_NAME: Cindy Watch
        CODE_SIGN_ENTITLEMENTS: CindyWatch/CindyWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.10"
    dependencies:
      - package: CindyKit
