name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build CindyApp (embeds CindyWatch)
        run: |
          xcodebuild build \
            -project Cindy.xcodeproj \
            -scheme CindyApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Find an iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in entries:
                  print(d["udid"])
                  sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run CindyKit unit tests
        # Plain `swift test` builds for the host (macOS) by default, but CindyKit
        # imports WatchConnectivity and HealthKit, neither available on macOS.
        # xcodebuild can build/test a Swift package directly (it recognizes
        # Package.swift and exposes a scheme named after the package) targeting
        # a real iOS Simulator, where those frameworks exist.
        working-directory: Packages/CindyKit
        run: |
          xcodebuild test \
            -scheme CindyKit \
            -destination "id=${{ steps.sim.outputs.udid }}"
