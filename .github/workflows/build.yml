name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build SenseApp (embeds SenseWatch, which embeds SenseComplication)
        # The complication needs no step of its own. The SenseApp scheme reaches the
        # SenseComplication appex transitively — SenseApp embeds SenseWatch, and
        # SenseWatch embeds the appex into its PlugIns/ folder — so an Info.plist or
        # bundle-identifier mistake in the extension fails right here.
        # ValidateEmbeddedBinary runs even with CODE_SIGNING_ALLOWED=NO, which is what
        # catches a bundle identifier not prefixed by the watch app's own.
        run: |
          xcodebuild build \
            -project Sense.xcodeproj \
            -scheme SenseApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Find an iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in entries:
                  print(d["udid"])
                  sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run SenseKit unit tests
        # Plain `swift test` builds for the host (macOS) by default, but SenseKit
        # imports WatchConnectivity, which macOS does not have — so the tests need
        # an iOS Simulator destination.
        #
        # Run through the project's SenseKitTests target rather than the package's
        # own scheme. Testing a bare Package.swift makes xcodebuild infer supported
        # platforms for an implicit workspace, which fails intermittently with
        # "Supported platforms for the buildables in the current scheme is empty"
        # and then offers no simulator destination at all. The project target uses
        # the same destination resolution as every other target here.
        run: |
          xcodebuild test \
            -project Sense.xcodeproj \
            -scheme SenseKitTests \
            -destination "id=${{ steps.sim.outputs.udid }}"
